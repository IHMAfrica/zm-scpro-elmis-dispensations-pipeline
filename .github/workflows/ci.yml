name: CI Build and Publish JAR Release

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

# env:
  # No container registry is needed; we publish the JAR as a GitHub Release asset.

jobs:
  build-and-publish-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build fat jar
        run: ./gradlew --no-daemon clean shadowJar

      - name: Resolve artifact name
        id: vars
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "VERSION_TAG=latest" >> $GITHUB_OUTPUT
          echo "JAR_PATH=build/libs/zm-scpro-elmis-dispensations-pipeline-all.jar" >> $GITHUB_OUTPUT

      - name: Create Git tag (lightweight) for this build
        id: tag
        run: |
          # Use commit SHA (first 7 chars) to create unique release tags
          TAG="release-${GITHUB_SHA:0:7}"
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: Release ${{ steps.tag.outputs.TAG }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.vars.outputs.JAR_PATH }}

      - name: Prepare k8s manifests artifact
        run: |
          TAG=${{ steps.tag.outputs.TAG }}
          sed -e "s#JAR_RELEASE_TAG#${TAG}#g" \
              k8s/fleet/flink-sessionjob.yaml > k8s/fleet/flink-sessionjob.resolved.yaml

      - name: Upload manifests artifact
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifests
          path: |
            k8s/fleet/*.yaml